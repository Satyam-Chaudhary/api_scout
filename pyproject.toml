[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-scout"
version = "0.1.0"
description = "Evidence-driven SaaS integration readiness research agent"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic",
    "python-dotenv",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "models*", "pipeline*", "analytics*"]